[package]
name = "sdif-lsp"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "sdif-lsp"
path = "src/main.rs"

[dependencies]
sdif-rs = { path = "../sdif-rs" }
tree-sitter = "0.26"
tree-sitter-sdif = { path = "../tree-sitter-sdif" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
lsp-types = "0.95"
serde_json = "1.0"
